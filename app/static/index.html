<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Monitor — Painel de Ativos</title>
<script src="/static/vendor/chart.umd.js"></script>
<style>
  :root{
    --bg: #12161b;
    --panel: #1a2028;
    --panel-2: #212832;
    --line: #2a3240;
    --text: #e7ebef;
    --muted: #8b96a3;
    --online: #34d67f;
    --online-dim: #1e6a45;
    --warn: #f0a83c;
    --offline: #ef4a52;
    --accent: #4fb0ff;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-ui); min-height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #151b21, #12161b);
    position:sticky; top:0; z-index:5;
    flex-wrap:wrap; gap:14px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    color:var(--accent); text-transform:uppercase;
  }
  h1{margin:0; font-size:20px; font-weight:650;}
  .stats{display:flex; gap:22px; align-items:center; font-family:var(--font-mono);}
  .stat{text-align:center;}
  .stat .n{font-size:22px; font-weight:700; display:block; line-height:1;}
  .stat .l{font-size:10px; color:var(--muted); letter-spacing:.08em;}
  .stat.online .n{color:var(--online);}
  .stat.offline .n{color:var(--offline);}
  .actions{display:flex; gap:10px;}
  button{
    font-family:var(--font-ui); border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); padding:9px 14px; border-radius:7px; font-size:13px;
    cursor:pointer; transition:.15s border-color, .15s background;
  }
  button:hover{border-color:var(--accent); background:#242c37;}
  button.primary{background:var(--accent); color:#0b1117; border-color:var(--accent); font-weight:600;}
  button.primary:hover{filter:brightness(1.08);}

  .toolbar{
    display:flex; gap:12px; padding:16px 28px; align-items:center; flex-wrap:wrap;
  }
  input[type=text], select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:8px 12px; border-radius:7px; font-size:13px; font-family:var(--font-ui);
  }

  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:12px; padding:4px 28px 32px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; cursor:pointer; transition:.15s transform, .15s border-color;
    position:relative; overflow:hidden;
  }
  .card:hover{transform:translateY(-2px); border-color:#3a4557;}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start;}
  .card .name{font-weight:600; font-size:14px; margin-bottom:2px;}
  .card .ip{font-family:var(--font-mono); font-size:12px; color:var(--muted);}
  .card .group{
    font-family:var(--font-mono); font-size:9.5px; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase; margin-top:8px;
  }
  .card .rtt{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:6px;}

  .pulse{
    width:11px; height:11px; border-radius:50%; position:relative; flex-shrink:0; margin-top:2px;
  }
  .pulse.online{background:var(--online); box-shadow:0 0 0 0 rgba(52,214,127,.6); animation:ping 1.8s infinite;}
  .pulse.offline{background:var(--offline);}
  .pulse.unknown{background:#555;}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(52,214,127,.55);}
    70%{box-shadow:0 0 0 9px rgba(52,214,127,0);}
    100%{box-shadow:0 0 0 0 rgba(52,214,127,0);}
  }
  .card.offline{border-color: rgba(239,74,82,.5); background:linear-gradient(180deg, rgba(239,74,82,.06), var(--panel));}
  .card.offline .name{color:var(--offline);}

  /* Modais */
  .overlay{
    position:fixed; inset:0; background:rgba(8,10,13,.65); display:none;
    align-items:center; justify-content:center; z-index:20; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:22px; width:100%; max-width:420px;
  }
  .modal h2{margin:0 0 16px; font-size:16px;}
  .modal label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px;}
  .modal input[type=text], .modal input[type=file]{width:100%;}
  .modal .row{display:flex; gap:10px; justify-content:flex-end; margin-top:20px;}
  .modal.wide{max-width:640px;}

  /* Toasts de alerta */
  #toasts{position:fixed; top:16px; right:16px; z-index:50; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:#241417; border:1px solid var(--offline); color:var(--text);
    padding:12px 16px; border-radius:8px; font-size:13px; min-width:240px;
    box-shadow:0 6px 18px rgba(0,0,0,.4); animation:slidein .2s ease-out;
  }
  .toast b{color:var(--offline);}
  @keyframes slidein{from{transform:translateX(20px); opacity:0;} to{transform:translateX(0); opacity:1;}}

  .empty{color:var(--muted); padding:40px; text-align:center; font-family:var(--font-mono); font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eyebrow">Rede interna · Monitoramento contínuo</span>
    <h1>Ping Monitor</h1>
  </div>
  <div class="stats">
    <div class="stat online"><span class="n" id="statOnline">–</span><span class="l">ONLINE</span></div>
    <div class="stat offline"><span class="n" id="statOffline">–</span><span class="l">OFFLINE</span></div>
    <div class="stat"><span class="n" id="statTotal">–</span><span class="l">TOTAL</span></div>
  </div>
  <div class="actions">
    <button onclick="openImport()">Importar Excel</button>
    <button onclick="openAssetModal()">+ Ativo</button>
    <button class="primary" onclick="exportReport()">Exportar Relatório</button>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="Buscar por nome ou IP..." oninput="renderGrid()">
  <select id="filterGroup" onchange="renderGrid()"><option value="">Todos os grupos</option></select>
  <select id="filterStatus" onchange="renderGrid()">
    <option value="">Todos os status</option>
    <option value="online">Somente online</option>
    <option value="offline">Somente offline</option>
  </select>
</div>

<div id="grid"></div>

<!-- Toasts -->
<div id="toasts"></div>

<!-- Modal: adicionar/editar ativo -->
<div class="overlay" id="assetOverlay">
  <div class="modal">
    <h2 id="assetModalTitle">Novo ativo</h2>
    <input type="hidden" id="assetId">
    <label>Nome</label>
    <input type="text" id="assetName" placeholder="Ex: Caminhão 41 - Rádio">
    <label>Endereço IP</label>
    <input type="text" id="assetIp" placeholder="Ex: 10.20.1.41">
    <label>Grupo</label>
    <input type="text" id="assetGroup" placeholder="Ex: Frota, Escritório...">
    <div class="row">
      <button onclick="closeAssetModal()">Cancelar</button>
      <button class="primary" onclick="saveAsset()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: importar excel -->
<div class="overlay" id="importOverlay">
  <div class="modal">
    <h2>Importar planilha Excel</h2>
    <p style="color:var(--muted); font-size:12.5px;">
      A planilha precisa ter uma coluna de IP (ex: "IP"). Colunas de nome e grupo são opcionais.
      IPs já cadastrados são atualizados; IPs novos são adicionados.
    </p>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <div class="row">
      <button onclick="closeImport()">Cancelar</button>
      <button class="primary" onclick="uploadExcel()">Importar</button>
    </div>
  </div>
</div>

<!-- Modal: histórico -->
<div class="overlay" id="historyOverlay">
  <div class="modal wide">
    <h2 id="historyTitle">Histórico</h2>
    <canvas id="historyChart" height="180"></canvas>
    <div class="row">
      <button onclick="closeHistory()">Fechar</button>
    </div>
  </div>
</div>

<script>
let assets = {};       // id -> asset
let chartInstance = null;

async function loadAssets(){
  const res = await fetch('/api/assets');
  const data = await res.json();
  assets = {};
  data.forEach(a => assets[a.id] = a);
  updateGroupFilter();
  renderGrid();
}

function updateGroupFilter(){
  const sel = document.getElementById('filterGroup');
  const current = sel.value;
  const groups = [...new Set(Object.values(assets).map(a => a.group || 'Geral'))].sort();
  sel.innerHTML = '<option value="">Todos os grupos</option>' +
    groups.map(g => `<option value="${g}">${g}</option>`).join('');
  sel.value = current;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('search').value.toLowerCase();
  const fg = document.getElementById('filterGroup').value;
  const fs = document.getElementById('filterStatus').value;

  let list = Object.values(assets).filter(a => {
    if (q && !(a.name.toLowerCase().includes(q) || a.ip.includes(q))) return false;
    if (fg && (a.group || 'Geral') !== fg) return false;
    if (fs === 'online' && !a.last_status) return false;
    if (fs === 'offline' && a.last_status !== false) return false;
    return true;
  });

  list.sort((a,b) => (a.group||'').localeCompare(b.group||'') || a.name.localeCompare(b.name));

  if (list.length === 0){
    grid.innerHTML = '<div class="empty">Nenhum ativo cadastrado ainda. Importe uma planilha ou adicione manualmente.</div>';
    updateStats();
    return;
  }

  grid.innerHTML = list.map(a => {
    const st = a.last_status === true ? 'online' : a.last_status === false ? 'offline' : 'unknown';
    const cardCls = st === 'offline' ? 'card offline' : 'card';
    const rtt = a.last_rtt_ms != null ? a.last_rtt_ms + ' ms' : '—';
    return `
      <div class="${cardCls}" data-id="${a.id}" onclick="openHistory(${a.id})" ondblclick="event.stopPropagation(); openAssetModal(assets[${a.id}])" title="Clique: ver histórico · Duplo clique: editar">
        <div class="top">
          <div>
            <div class="name">${a.name}</div>
            <div class="ip">${a.ip}</div>
          </div>
          <div class="pulse ${st}"></div>
        </div>
        <div class="group">${a.group || 'Geral'}</div>
        <div class="rtt">RTT: ${rtt}</div>
      </div>`;
  }).join('');

  updateStats();
}

function updateStats(){
  const all = Object.values(assets);
  const online = all.filter(a => a.last_status === true).length;
  const offline = all.filter(a => a.last_status === false).length;
  document.getElementById('statOnline').textContent = online;
  document.getElementById('statOffline').textContent = offline;
  document.getElementById('statTotal').textContent = all.length;
}

// ---------- WebSocket ----------
function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'status_update'){
      msg.assets.forEach(u => {
        if (assets[u.id]) Object.assign(assets[u.id], u);
      });
      renderGrid();
    } else if (msg.type === 'alert_down'){
      msg.assets.forEach(a => showToast(a));
    }
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}

function showToast(a){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<b>Queda detectada</b><br>${a.name} (${a.ip})`;
  box.appendChild(el);
  setTimeout(() => el.remove(), 8000);
}

// ---------- Modal: ativo ----------
function openAssetModal(a){
  document.getElementById('assetModalTitle').textContent = a ? 'Editar ativo' : 'Novo ativo';
  document.getElementById('assetId').value = a ? a.id : '';
  document.getElementById('assetName').value = a ? a.name : '';
  document.getElementById('assetIp').value = a ? a.ip : '';
  document.getElementById('assetGroup').value = a ? a.group : '';
  document.getElementById('assetOverlay').classList.add('show');
}
function closeAssetModal(){ document.getElementById('assetOverlay').classList.remove('show'); }

async function saveAsset(){
  const id = document.getElementById('assetId').value;
  const body = {
    name: document.getElementById('assetName').value.trim(),
    ip: document.getElementById('assetIp').value.trim(),
    group: document.getElementById('assetGroup').value.trim() || 'Geral',
    active: true
  };
  if (!body.name || !body.ip){ alert('Preencha nome e IP.'); return; }

  const url = id ? `/api/assets/${id}` : '/api/assets';
  const method = id ? 'PUT' : 'POST';
  const res = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!res.ok){ const err = await res.json(); alert(err.detail || 'Erro ao salvar'); return; }
  closeAssetModal();
  loadAssets();
}

// ---------- Modal: importar excel ----------
function openImport(){ document.getElementById('importOverlay').classList.add('show'); }
function closeImport(){ document.getElementById('importOverlay').classList.remove('show'); }

async function uploadExcel(){
  const fileInput = document.getElementById('excelFile');
  if (!fileInput.files.length){ alert('Selecione um arquivo.'); return; }
  const form = new FormData();
  form.append('file', fileInput.files[0]);
  const res = await fetch('/api/import-excel', {method:'POST', body: form});
  const data = await res.json();
  if (!res.ok){ alert(data.detail || 'Erro ao importar'); return; }
  alert(`Importação concluída: ${data.created} novos, ${data.updated} atualizados, ${data.skipped} ignorados.`);
  closeImport();
  loadAssets();
}

// ---------- Modal: histórico ----------
async function openHistory(id){
  const a = assets[id];
  document.getElementById('historyTitle').textContent = `${a.name} — ${a.ip}`;
  document.getElementById('historyOverlay').classList.add('show');

  const res = await fetch(`/api/history/${id}?hours=24`);
  const rows = await res.json();

  const labels = rows.map(r => new Date(r.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}));
  const rtts = rows.map(r => r.rtt_ms);

  const ctx = document.getElementById('historyChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Latência (ms)',
        data: rtts,
        borderColor: '#4fb0ff',
        backgroundColor: 'rgba(79,176,255,.12)',
        spanGaps: true,
        tension: .25,
        pointRadius: 2,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#8b96a3' } } },
      scales: {
        x: { ticks: { color:'#8b96a3', maxTicksLimit: 10 }, grid:{ color:'#2a3240' } },
        y: { ticks: { color:'#8b96a3' }, grid:{ color:'#2a3240' }, title:{display:true, text:'ms', color:'#8b96a3'} }
      }
    }
  });
}
function closeHistory(){ document.getElementById('historyOverlay').classList.remove('show'); }

// ---------- Exportar ----------
function exportReport(){
  window.open('/api/export?hours=24', '_blank');
}

loadAssets();
connectWS();
setInterval(loadAssets, 60000); // reforço de sincronização a cada 1 min
</script>
</body>
</html>
